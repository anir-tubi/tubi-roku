name: Pull Request Info Verify

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read
  pull-requests: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  prInfoVerify:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v2

      # npm command install only production packages
      - name: npm install
        run: |
          npm install

      - name: Run Workflow Code
        run: node ./js/workflows/prInfoVerify.js
