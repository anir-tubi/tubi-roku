name: Upload Test Reports to S3

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Name of the artifact to download'
        required: true
      run_id:
        description: 'Run ID of the workflow that produced the artifact'
        required: true
      platform:
        description: 'Platform name (e.g., roku)'
        required: true
        default: 'roku'
      env:
        type: choice
        description: 'Target S3 environment'
        options:
          - staging
          - production
        default: 'production'

jobs:
  upload-to-s3:
    runs-on: [self-hosted, "${{ inputs.env }}"]
    env:
      BUCKET: "tubi-automation-ott-reports-${{ inputs.env }}"
      REGION: "${{ inputs.env == 'production' && 'us-west-2' || 'us-east-2' }}"
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download and extract artifact
        env:
          GITHUB_TOKEN: ${{ secrets.ROKU_AUTO_PAT }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          RUN_ID: ${{ inputs.run_id }}
          OUTPUT_DIR: allure-report
        run: node .github/scripts/downloadArtifact.js

      - name: Upload report to S3
        run: |
          S3_REPORT_DIR="reports/${PLATFORM}/${{ inputs.run_id }}"
          echo "S3_REPORT_DIR=$S3_REPORT_DIR" >> $GITHUB_ENV
          aws s3 sync "./allure-report" "s3://${BUCKET}/${S3_REPORT_DIR}/" \
            --region "${REGION}"

      - name: Download or create data.json
        run: |
          if ! aws s3 cp "s3://${BUCKET}/reports/${PLATFORM}/data.json" ./data.json \
            --region "${REGION}"; then
            echo "[]" > data.json
          fi

      - name: Update data.json
        env:
          BUILD_NUMBER: ${{ inputs.run_id }}
        run: node .github/scripts/updateReportDataJson.js

      - name: Upload updated data.json
        run: |
          aws s3 cp "./data.json" "s3://${BUCKET}/reports/${PLATFORM}/data.json" \
            --region "${REGION}" \
            --cache-control "no-store"
