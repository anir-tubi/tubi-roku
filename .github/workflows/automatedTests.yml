# This workflow executes the Automated UI Tests when triggered from the Github UI
# This will be executed on a self-hosted runner tagged with automated-tests-runner
name: Automated UI Tests

env:
  runName: ${{ format('{0}; {1}', github.ref_name, inputs.tag || 'Run All Tests') }}${{ inputs.tag == 'Custom String' && format('{0} "{1}"', ':', inputs.customString) || ''}}

# We are giving a name for the run to make it easier to see what was run. Not the prettiest for conditional strings but do not see another solution. Colon with a space after is a problem as well that we have to work around.
# As an example if the branch name is qa_2_21_20 and we're running the @leftnav tag then the run name would: qa_2_21_20; @leftnav.
# For a custom string of "C4153" it would be: qa_2_21_20; Custom String: "C4153"
run-name: ${{ format('{0}; {1}', github.ref_name, inputs.tag || 'Run All Tests') }}${{ inputs.tag == 'Custom String' && format('{0} "{1}"', ':', inputs.customString) || ''}}

# Controls when the action will run.
on:
  # Run automatically at 2 AM Eastern time (6 AM UTC for EDT, 7 AM UTC for EST)
  schedule:
    - cron: '0 6 * * *'
    
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        type: choice
        description: 'Used to run tests with a specific tag. Use "Run All Tests" to run all tests. Use "Custom String" to provide an alternative string input below.'
        default: 'Run All Tests'
        options:
          - 'Run All Tests'
          - 'Custom String'
          # The remaining options are generated using gulp outputAvailableAutomatedTestTags
          - '@age_gate'
          - '@application_launch'
          - '@autoplay'
          - '@categories'
          - '@closed_captions'
          - '@espanol'
          - '@homescreen'
          - '@kidsmode_guest'
          - '@kidsmode_registered'
          - '@large_poster'
          - '@lazyload'
          - '@live'
          - '@mdp_1'
          - '@multiple_audio'
          - '@mystuff'
          - '@parental_controls'
          - '@playback_1'
          - '@reactions'
          - '@registered_user'
          - '@regression'
          - '@sdp_1'
          - '@sdp_2'
          - '@search'
          - '@settings'
          - '@sidenav'
          - '@sidenav_test'
          - '@signupsaveprogress'
          - '@smoke'
          - '@videopreview'
          - '@welcome_modal'
          - '@welcome_modaltest'
          - '@send_feedback'
      customString:
        description: 'Use to provide a custom string of which test to run. You can use the the pipe symbol "|" to provide more than one one string. For example "C4151|C4153" would run both the C4151 test and C4153 test. This input is ignored unless "Custom String" is set above.'
        type: string
      bail:
        description: 'Stop running on first test failure'
        default: false
        type: boolean

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Job to determine the target branches to run the tests against
  set-target-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-matrix.outputs.branches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Build matrix of target branches
        id: set-matrix
        run: |
          # For manual workflow_dispatch, use the selected branch
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SELECTED_BRANCH="${{ github.ref_name }}"
            echo "Manual dispatch detected, using selected branch: $SELECTED_BRANCH"
            echo 'branches=["'$SELECTED_BRANCH'"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For scheduled runs, find latest QA branch and build matrix with master
          # Fetch all remote branches
          git fetch --all
          
          # Find all QA branches matching pattern qa_*_*_* (e.g., qa_3_8_36) and get the most recently updated one
          # Pattern matches: qa_ followed by digits, underscore, digits, underscore, digits
          LATEST_QA_BRANCH=$(git for-each-ref --sort=-committerdate refs/remotes/origin/qa_* --format='%(refname:short)' | sed 's|origin/||' | grep -E '^qa_[0-9]+_[0-9]+_[0-9]+$' | head -n 1)
          
          # Build matrix JSON - always include master
          if [ -z "$LATEST_QA_BRANCH" ]; then
            echo "No QA branch found matching pattern qa_*_*_*"
            echo 'branches=["master"]' >> "$GITHUB_OUTPUT"
          else
            echo "Found latest QA branch: $LATEST_QA_BRANCH"
            echo 'branches=["master","'$LATEST_QA_BRANCH'"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: set-target-branches
    # Use matrix strategy to run against both master and latest QA branch
    strategy:
      fail-fast: false
      max-parallel: 1 # Limits concurrent jobs to 1 to avoid flakiness from sharing Rokus
      matrix:
        branch: ${{ fromJson(needs.set-target-branches.outputs.branches) }}
    # name helps to check the status of github action
    name: Run Automated UI Tests (${{ matrix.branch }})
    # The type of runner that the job will run
    runs-on: [self-hosted, enabled, roku, automation-regression]
    # timeouts after 3 hours
    timeout-minutes: 180

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # print out passed in job params for reference
      - name: Job Params
        run: |
          echo branch: "${{ matrix.branch }}"
          echo tag: "${{ inputs.tag }}"
          echo customString: "${{ inputs.customString }}"
          echo bail: "${{ inputs.bail }}"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      # npm command install all required packages
      - name: npm install
        run: |
          npm install

      - name: gulp runAutomatedTests
        env:
          runId: ${{ github.run_id }}
          branch: ${{ matrix.branch }}
          tag: ${{ inputs.tag || 'Run All Tests' }}
          customString: ${{ inputs.customString || '' }}
          bail: ${{ inputs.bail || false }}
          retries: 1
        run: |
          cp ./rta-config.example.json ./rta-config.json
          sed -i -e "s/<DEVICE-IP>/$ROKU_DEV_TARGET/g" ./rta-config.json
          sed -i -e "s/<DEVICE-PASSWORD>/$DEV_PASSWORD/g" ./rta-config.json
          npx gulp runAutomatedTests

      - name: Sanitize branch name for artifact upload
        id: sanitize-branch-name
        if: success() || failure()
        run: |
          # Replace invalid characters with underscores
          # Invalid chars: " : < > | * ? \r \n \ /
          SANITIZED_BRANCH_NAME=$(echo "${{ matrix.branch }}" | sed 's/[":<>|*?\\\/]/_/g' | tr -d '\r\n')
          echo "value=$SANITIZED_BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload JSON Report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: JSON Report (${{ steps.sanitize-branch-name.outputs.value }})
          path: out/ui-tests-output/report.json

      - name: Upload HTML Report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTML Report (${{ steps.sanitize-branch-name.outputs.value }})
          path: out/ui-tests-output/html

      - name: Upload Failed Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failed Test Screenshots (${{ steps.sanitize-branch-name.outputs.value }})
          path: out/ui-tests-output/screenshots

      - name: Send Slack Notification
        if: success() || failure()
        run: |
          npx ts-node ./js/workflows/sendSlackAutomatedTestsResultNotification.ts "${{ matrix.branch }}"
