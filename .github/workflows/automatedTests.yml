# This workflow executes the Automated UI Tests when triggered from the Github UI
# This will be executed on a self-hosted runner tagged with automated-tests-runner
name: Automated UI Tests

env:
  runName: ${{ format('{0}; {1}', github.ref_name, inputs.tag || 'Run All Tests') }}${{ inputs.tag == 'Custom String' && format('{0} "{1}"', ':', inputs.customString) || ''}}

# We are giving a name for the run to make it easier to see what was run. Not the prettiest for conditional strings but do not see another solution. Colon with a space after is a problem as well that we have to work around.
# As an example if the branch name is qa_2_21_20 and we're running the @leftnav tag then the run name would: qa_2_21_20; @leftnav.
# For a custom string of "C4153" it would be: qa_2_21_20; Custom String: "C4153"
run-name: ${{ format('{0}; {1}', github.ref_name, inputs.tag || 'Run All Tests') }}${{ inputs.tag == 'Custom String' && format('{0} "{1}"', ':', inputs.customString) || ''}}

# Controls when the action will run.
on:
  # Run automatically at 4:45 AM UTC / 11:45 PM Eastern time / 8:45 PM Pacific time
  schedule:
    - cron: '45 4 * * *'  
    
  # Also allow manual trigger
  workflow_dispatch:
    inputs:
      tag:
        type: choice
        description: 'Used to run tests with a specific tag. Use "Run All Tests" to run all tests. Use "Custom String" to provide an alternative string input below.'
        default: 'Run All Tests'
        options:
          - 'Run All Tests'
          - 'Custom String'
          # The remaining options are generated using gulp outputAvailableAutomatedTestTags
          - '@ads'
          - '@age_gate'
          - '@analytics'
          - '@application_launch'
          - '@audio_description'
          - '@autoplay'
          - '@backgrounding'
          - '@browse'
          - '@browse_watching'
          - '@buttons'
          - '@bww'
          - '@carousel'
          - '@categories'
          - '@category'
          - '@closed_captions'
          - '@consent'
          - '@continue_watching'
          - '@creator'
          - '@cwconsent'
          - '@daily_sign_in_sign_out'
          - '@deeplink'
          - '@details_page'
          - '@espanol'
          - '@example'
          - '@expiration'
          - '@featured'
          - '@gdpr'
          - '@guest'
          - '@hdc'
          - '@homescreen'
          - '@impressions'
          - '@kids'
          - '@kids_mode'
          - '@kids_trailer'
          - '@kidsmode'
          - '@kidsmode_guest'
          - '@kidsmode_registered'
          - '@lazyload'
          - '@linear'
          - '@live'
          - '@locale'
          - '@manual_regression'
          - '@mdp_1'
          - '@midroll'
          - '@movies'
          - '@multiple_audio'
          - '@my_stuff'
          - '@mystuff'
          - '@navigation'
          - '@network'
          - '@news'
          - '@param'
          - '@parental_controls'
          - '@password_reset'
          - '@pause_ads'
          - '@pivots'
          - '@playback_1'
          - '@preroll'
          - '@reactions'
          - '@registered'
          - '@registered_user'
          - '@registration'
          - '@regression'
          - '@sdp_1'
          - '@sdp_2'
          - '@search'
          - '@send_feedback'
          - '@series_details_page'
          - '@settings'
          - '@sidenav'
          - '@sidenav_test'
          - '@signupsaveprogress'
          - '@signupsaveprogressexit'
          - '@skins'
          - '@skip_intro'
          - '@smoke'
          - '@sports'
          - '@spotlightAd'
          - '@thematic_takeover'
          - '@trailers'
          - '@tv'
          - '@tvshows'
          - '@video_preview'
          - '@video_tiles'
          - '@videopreview'
          - '@voice_commands'
          - '@welcome_modal'
          - '@wrapper_ads'
          - '@ymal'
      customString:
        description: 'Use to provide a custom string of which test to run. You can use the the pipe symbol "|" to provide more than one one string. For example "C4151|C4153" would run both the C4151 test and C4153 test. This input is ignored unless "Custom String" is set above.'
        type: string
      bail:
        description: 'Stop running on first test failure'
        default: false
        type: boolean
      skipSlackNotification:
        description: 'Skip posting Slack notification when run completes'
        default: false
        type: boolean

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  detect-runner:
    uses: ./.github/workflows/detect-multi-device-runner.yml
    secrets:
      ROKU_AUTO_PAT: ${{ secrets.ROKU_AUTO_PAT }}

  test:
    needs: detect-runner
    name: Run Automated UI Tests [${{ needs.detect-runner.outputs.available == 'true' && 'multi-device' || 'single-device' }}]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/run-automated-tests.yml
    with:
      runner-labels: ${{ needs.detect-runner.outputs.available == 'true' && '["self-hosted", "enabled", "roku", "automation-regression", "multi-device"]' || '["self-hosted", "enabled", "roku", "automation-regression"]' }}
      runner-type: ${{ needs.detect-runner.outputs.available == 'true' && 'multi-device' || 'single-device' }}
      target-branch: ${{ github.ref_name }}
      tag: ${{ inputs.tag || 'Run All Tests' }}
      customString: ${{ inputs.customString || '' }}
      bail: ${{ inputs.bail || false }}
      skipSlackNotification: ${{ inputs.skipSlackNotification || false }}
    secrets:
      ROKU_AUTO_PAT: ${{ secrets.ROKU_AUTO_PAT }}
