# This workflow executes the Automated UI Tests when triggered from the Github UI
# This will be executed on a self-hosted runner tagged with automated-tests-runner
name: Automated UI Tests @smoke

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the master branch.
  pull_request:
    branches: [ master ]

# We want to cancel the previously running job if a new commit gets pushed
concurrency:
  group: ${{ github.head_ref }}-smoke-tests
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # name helps to check the status of github action
    name: Run Automated UI Tests @smoke
    # The type of runner that the job will run
    runs-on: [self-hosted, enabled, roku, automation-smoke]
    # timeouts after 15 minutes, if the execution/automated tests got stuck/crash
    timeout-minutes: 15
    # Permissions for posting PR comments
    permissions:
      contents: read
      issues: write
      pull-requests: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Generate rta-config.json
        run: node js/workflows/generateRtaConfig.js

      - name: gulp runAutomatedTestsSmoke
        env:
          retries: 1
        run: |
          npx gulp runAutomatedTestsSmoke

      - name: Upload JSON Report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: JSON Report
          path: out/ui-tests-output/report.json

      - name: Upload HTML Report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTML Report
          path: out/ui-tests-output/html

      - name: Upload Failed Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failed Test Screenshots
          path: out/ui-tests-output/screenshots

      - name: Post PR Test Results Comment
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx ts-node ./js/workflows/postPRTestResults.ts
