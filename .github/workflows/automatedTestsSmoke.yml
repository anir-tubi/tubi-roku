# This workflow executes the Automated UI Tests when triggered from the Github UI
# This will be executed on a self-hosted runner tagged with automated-tests-runner
name: Automated UI Tests @smoke

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the master branch.
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/automatedTestsSmoke.yml'
      - '.github/workflows/detect-multi-device-runner.yml'
      - '.github/workflows/run-automated-tests-smoke.yml'
      - 'automated-tests-config/**'
      - 'build-config/**'
      - 'config/**'
      - 'js/automated-tests/**'
      - 'js/workflows/**'
      - 'js/automated-tests.js'
      - 'src/**'
      - 'gulpfile.js'

# We want to cancel the previously running job if a new commit gets pushed
concurrency:
  group: ${{ github.head_ref }}-smoke-tests
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Detect if multi-device runner is available, fallback to single-device if not
  detect-runner:
    uses: ./.github/workflows/detect-multi-device-runner.yml
    secrets:
      ROKU_AUTO_PAT: ${{ secrets.ROKU_AUTO_PAT }}

  # Run tests with dynamic runner selection
  test:
    needs: detect-runner
    name: Run Automated UI Tests @smoke [${{ needs.detect-runner.outputs.available == 'true' && 'multi-device' || 'single-device' }}]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/run-automated-tests-smoke.yml
    with:
      runner-labels: ${{ needs.detect-runner.outputs.available == 'true' && '["self-hosted", "enabled", "roku", "automation-smoke", "multi-device"]' || '["self-hosted", "enabled", "roku", "automation-smoke"]' }}
