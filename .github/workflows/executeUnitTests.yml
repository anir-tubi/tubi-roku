# This file executes the unit tests when PR is raised against master branch.
# This will be executed in Roku device available in SF office and logs will be captured in machine/server available in SF office.
# Device details can be found here : https://tubitv.atlassian.net/wiki/spaces/IT/pages/edit-v2/2465464321
# Roku IP address and password are taken from .env file from github action runner. If you update it, reboot the machine

name: Execute Unit Tests

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the master branch.
  pull_request:
    branches: [ master ]

# We want to cancel the previously running job if a new commit gets pushed
concurrency:
  group: ${{ github.head_ref }}-unit-tests
  cancel-in-progress: true
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Detect if multi-device runner is available, fallback to single-device if not
  detect-runner:
    uses: ./.github/workflows/detect-multi-device-runner.yml
    secrets:
      ROKU_AUTO_PAT: ${{ secrets.ROKU_AUTO_PAT }}

  build:
    needs: detect-runner
    name: Execute Unit Tests [${{ needs.detect-runner.outputs.available == 'true' && 'multi-device' || 'single-device' }}]
    runs-on: ${{ fromJSON(needs.detect-runner.outputs.available == 'true' && '["self-hosted", "enabled", "roku", "unit-tests", "multi-device"]' || '["self-hosted", "enabled", "roku", "unit-tests"]') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: npm install

      - name: Resolve Roku device IP
        id: device
        run: |
          if [ -n "$ROKU_DEVICES" ]; then
            echo "Multi-device runner detected, extracting first device from ROKU_DEVICES"
            DEVICE_HOST=$(echo "$ROKU_DEVICES" | jq -r '.[0].host')
            DEVICE_PASS=$(echo "$ROKU_DEVICES" | jq -r '.[0].password')
            echo "ROKU_DEV_TARGET=$DEVICE_HOST" >> $GITHUB_ENV
            echo "DEV_PASSWORD=$DEVICE_PASS" >> $GITHUB_ENV
          else
            echo "Single-device runner, using ROKU_DEV_TARGET=$ROKU_DEV_TARGET"
          fi

      - name: Run unit tests
        run: |
          echo "Unit Tests are running"
          npx gulp test --sametab > log.txt 2>&1
          actual=`grep 'RESULT:' log.txt | tail -1`
          expected="RESULT: Success"
          cat log.txt
          if [ "$actual" = "$expected" ]; then
              echo "Success"
              exit 0
          else
              echo "Unit tests failed. Please run 'gulp test' on your local branch for more information."
              exit 1
          fi
