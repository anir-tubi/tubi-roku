name: Automation UI Dashboard API

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - start
          - complete
          - push-report
          - complete-and-push
          - send-suite
      platform:
        description: 'Platform name'
        required: true
        default: 'roku'
      tag:
        description: 'Test tag (used for start action)'
        required: false
        default: 'Run All Tests'
      github_action_id:
        description: 'GitHub run ID of the calling workflow (required for start, send-suite, complete)'
        required: false
      estimated_tests:
        description: 'Estimated number of tests (optional, used by start action)'
        required: false
      estimated_suites:
        description: 'Estimated number of suites (required for start action)'
        required: false
      device_count:
        description: 'Number of devices participating in the run (used by start action)'
        required: false
        default: '1'
      test_outcome:
        description: 'Test outcome (success or failure) - used for complete action'
        required: false
        default: 'success'
      artifact_name:
        description: 'Name of the Allure Report artifact (used for push-report action)'
        required: false
      run_id:
        description: 'Run ID of the workflow that produced the artifact (used for push-report action)'
        required: false
      total_tests:
        description: 'Total number of tests executed'
        required: false
        default: '0'
      passed_tests:
        description: 'Number of passed tests'
        required: false
        default: '0'
      failed_tests:
        description: 'Number of failed tests'
        required: false
        default: '0'
      skipped_tests:
        description: 'Number of skipped tests'
        required: false
        default: '0'
      duration_ms:
        description: 'Test duration in milliseconds'
        required: false
        default: '0'
      suite_data:
        description: 'JSON-encoded suite result payload (used for send-suite action)'
        required: false

env:
  DASHBOARD_BASE_URL: https://automation-ui.infra.tubi-core-staging.tubi.io/api
  TEST_RUN_ID: ${{ inputs.platform }}.${{ inputs.github_action_id || inputs.run_id }}

jobs:
  dashboard-api:
    runs-on: [self-hosted, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start test run
        if: inputs.action == 'start'
        env:
          DASHBOARD_BASE_URL: ${{ env.DASHBOARD_BASE_URL }}
          PLATFORM: ${{ inputs.platform }}
          TAG: ${{ inputs.tag }}
          GITHUB_ACTION_ID: ${{ inputs.github_action_id }}
          ESTIMATED_TESTS: ${{ inputs.estimated_tests }}
          ESTIMATED_SUITES: ${{ inputs.estimated_suites }}
          DEVICE_COUNT: ${{ inputs.device_count }}
        run: node .github/scripts/dashboardReporter.js start

      - name: Send suite result to dashboard
        if: inputs.action == 'send-suite'
        env:
          DASHBOARD_BASE_URL: ${{ env.DASHBOARD_BASE_URL }}
          PLATFORM: ${{ inputs.platform }}
          TEST_RUN_ID: ${{ env.TEST_RUN_ID }}
          SUITE_DATA: ${{ inputs.suite_data }}
        run: node .github/scripts/dashboardReporter.js send-suite

      - name: Download and extract artifact
        if: inputs.action == 'push-report' || inputs.action == 'complete-and-push'
        env:
          GITHUB_TOKEN: ${{ secrets.ROKU_AUTO_PAT }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          RUN_ID: ${{ inputs.run_id }}
          OUTPUT_DIR: allure-report
        run: node .github/scripts/downloadArtifact.js

      - name: Complete test run
        if: always() && (inputs.action == 'complete' || inputs.action == 'complete-and-push')
        env:
          DASHBOARD_BASE_URL: ${{ env.DASHBOARD_BASE_URL }}
          PLATFORM: ${{ inputs.platform }}
          TEST_RUN_ID: ${{ env.TEST_RUN_ID }}
          TEST_OUTCOME: ${{ inputs.test_outcome }}
          TOTAL_TESTS: ${{ inputs.total_tests }}
          PASSED_TESTS: ${{ inputs.passed_tests }}
          FAILED_TESTS: ${{ inputs.failed_tests }}
          SKIPPED_TESTS: ${{ inputs.skipped_tests }}
          DURATION_MS: ${{ inputs.duration_ms }}
        run: node .github/scripts/dashboardReporter.js complete

      - name: Push report to dashboard
        if: always() && (inputs.action == 'push-report' || inputs.action == 'complete-and-push')
        env:
          API_URL: https://automation-ui.infra.tubi-core-staging.tubi.io/api/reports/ingest-direct
          PLATFORM: ${{ inputs.platform }}
          REPORT_ID: ${{ inputs.run_id }}
          REPORT_DIR: allure-report
        run: node .github/scripts/dashboardReporter.js push-report
        continue-on-error: true
