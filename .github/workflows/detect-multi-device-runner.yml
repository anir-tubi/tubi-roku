name: Detect Multi-Device Runner

on:
  workflow_call:
    secrets:
      ROKU_AUTO_PAT:
        required: true
    outputs:
      available:
        description: 'Whether a multi-device runner is available'
        value: ${{ jobs.detect.outputs.available }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}

    steps:
      - name: Ensure jq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq

      - id: check
        env:
          GH_TOKEN: ${{ secrets.ROKU_AUTO_PAT }}
        run: |
          if runners=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/runners); then

            has_multi=$(echo "$runners" | jq -r '
              [.runners[]
                | select(.status=="online")
                | select(.labels[]?.name=="multi-device")
              ] | length > 0
            ')

            echo "available=$has_multi" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi