settings:
  # Settings are added to constants.settings via getSettings
  # Any constants that need to be templatized should be added via settings
  mode: "qa"
  noAds: false  #setting to true will prevent ads from being requested from rainmaker
  stagingApis: false  #setting to true will use UAPI staging APIs (matrix, cms, user_device)
  remoteComponentsExtension: "zip" #prevents packages being built for qa builds, as they are not used - makes for faster builds
  skipAgeGate: false #setting to true will prevent the COPPA age gate screen from appearing

  # setting to true will activate/signup the app automatically with a generated email and username
  # (if the values of suitest & stagingApis are also true)
  automaticActivation: true

  #number of seconds that age information will be stored on the device.
  #Set to 0 to see age gate every time the app is opened.
  #Also controls instant resume timeout for signed out users
  coppaHasAgeDuration: 60

  #time in seconds after which the linear video player goes fullscreen.
  linearFullscreenTimeout: 10

  #the number of seconds before the video overlay autohides in Live TV after last button pressed.
  videoOverlayAutoHideTime: 5

  # hideStartupModals=true  ==> no startup modals are shown
  # hideStartupModals=false ==> Normal prod behavior
  hideStartupModals: false

  # A date which will be used as the current date within the app. Use this to simulate a date in the past or future. If a date is provided this gets converted to a time offset in seconds to allow testing of features only available at a particular time
  # testingTimeOffset: "2023-02-12T20:00:00Z"

  # email/password values will be used to automatically sign a user in when "sign in" is selected
  email: ""
  password: ""

  # setting printReqAndResInfo as true will print log for all api request information
  printReqAndResInfo: true

  # Setting sudoCountry and restarting the app will change the country of the app. For this to work, your public IP address must be white listed in
  # https://livebook-apps.main-staging-custom.staging.k8s.tubi.io/apps/country-override-ip-list
  # please contact CSS if you do not have access to this tool.
  # sudoCountry: "US"

  #To enable the Charles Proxy, set CharlesProxyEnabled true
  charlesProxyUrl: "http://{{localHostAddress}}:8888"
  charlesProxyEnabled: false

  # Setting the below value to true will enable youbora tracking.
  youboraEnabled: false
  # Setting the below value to true will enable youbora request logging into the console.
  youboraDebugEnabled: false

  # youboraEnabled has been deprecated. Use the below values instead.
  # Setting the below value to true will enable youbora tracking for vod.
  youboraEnabledVod: false
  # Setting the below value to true will enable youbora tracking for live.
  youboraEnabledLinear: false
  # Setting the below value to true will enable youbora tracking for preview.
  youboraEnabledPreview: false
  # Setting the below value to true will enable youbora tracking for trailer.
  youboraEnabledTrailer: false


  # Setting the below value to true will turn off displaying the skin ads feature (if there is a skin ads campaign) to avoid issues with automated tests on Roku devices not hooked up to display the feature
  disableSkinAds: false

  # Setting the below value to false will disable sending logs to client logs.
  clientLogsEnabled: true

  # Setting the below value to false will disable sending realtime metrics to Datadog.
  realtimeMetricsEnabled: true

  # Setting useLogSampling to false will send all client logs regardless of the sampling percentage to tubiLog().
  useLogSampling: true

  useStarterComponents: false
  useRemoteComponents: false

  # A date which will be used as the current date within the app. Use this to simulate a date in the past or future. If a date is provided this gets converted to a time offset in seconds to allow testing of features only available at a particular time
  # testingTimeOffset: "2022-12-18T20:00:00Z"

  bs_const:
    #By default nothing will be printed to debug console.(port : 8085)
    #To enable console debug logs, set consoleLoggingEnabled to true
    consoleLoggingEnabled: true
    #setting to true will use analytics proxy server and display category slugs and content id in UI
    useQaAnalyticsProxy: false
    # Setting to true will route linear playback manifest request through qa proxy.
    linearQaProxyEnabled: false
    # Setting to enable/disable braze logging.
    brazeLoggingEnabled: true

  #setting to true will result in suitest being loaded
  suitest: false

manifest:
  # Set to 0 to prevent instant resume functionality.
  # Setting to 0 is required to run analytics automated tests via Suitest's v3 js library
  run_as_process: 1
