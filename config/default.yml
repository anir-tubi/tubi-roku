settings:
  # Settings are added to constants.settings via getSettings
  # Any constants that need to be templatized via handlebars should be added via settings
  mode: "production"
  version: "{{versionUnderscored}}"
  contentType: "hls"
  shortAppName: "tubitv"
  platformName: "roku"
  starterComponentsUrl: "https://mrcdn-production.tubitv.com/appFiles/starter-components/tubi_starter_components_{{versionMinorUnderscored}}.pkg"
  remoteComponentsUrl:  "https://mrcdn-production.tubitv.com/appFiles/components/tubi_remote_components_{{versionUnderscored}}.pkg"
  oneTrustComponentsUrl:  "https://mrcdn-production.tubitv.com/appFiles/one-trust-components/tubi_one_trust_components_{{oneTrustVersionUnderscored}}.pkg"
  remoteComponentsExtension: "pkg"
  remoteComponentLibProvided: "{{remoteComponentLibProvided}}"
  suitest: false
  noAds: false
  # NEVER CHANGE THESE VALUES FOR PRODUCTION
  # charlesProxyEnabled should be false and charlesProxyUrl set to empty string.
  # follow exact format for bs_const: "consoleLoggingEnabled=false"
  charlesProxyEnabled: false
  charlesProxyUrl: ""

  #time in seconds after which the linear video player goes fullscreen.
  linearFullscreenTimeout: 10

  #the number of seconds before the video overlay autohides in Live TV after last button pressed.
  videoOverlayAutoHideTime: 5
  videoOverlayLiteAutoHideTime: 10

  # useStarterComponents MUST ALWAYS BE TRUE FOR PRODUCTION
  useStarterComponents: true
  useRemoteComponents: false

  # Set to true only if running an experiment from within the StarterController. This is used to determine if we use the full version of the StarterController that includes the dependencies need to run experiments at the Starter component library level. By not including these dependencies when not needed, we can reduce the size of the Starter component library and the time it takes to compile.
  useFullStarterController: false

  # Setting the below value to true will enable youbora tracking.
  youboraEnabled: false
  # Setting the below value to true will enable youbora request logging into the console.
  youboraDebugEnabled: false

  # Setting the below value to true will enable player log tracking.
  playerLogEnabled: false

  # Setting the below value to false will disable sending logs to client logs.
  clientLogsEnabled: true

  # Setting useLogSampling to false will send all client logs regardless of the sampling percentage to tubiLog().
  useLogSampling: true

  # Setting the below value to true will turn off hdmi status checks to avoid issues with automated tests on Roku devices not hooked up to a display
  disableHdmiStatusChecks: false

  # Setting the below value to true will turn off displaying the skin ads feature (if there is a skin ads campaign) to avoid issues with automated tests on Roku devices not hooked up to display the feature
  disableSkinAds: false

  # Setting the below value to true will turn off running any experiments which is useful while running automated tests
  disableExperiments: false

  # Any configs added to the bs_const setting will be included in the various manifest
  # configurations via the handlebars templates
  bs_const:
    consoleLoggingEnabled: false
    consoleLoggingIncludeTimestamp: false # whether to include timestamp in log outputs
    useQaAnalyticsProxy: false
    # Setting to true will route linear playback manifest request through qa proxy.
    linearQaProxyEnabled: false
    # Setting to enable/disable braze logging.
    brazeLoggingEnabled: false

manifest:
  title: "Tubi"
  mm_icon_focus_hd: "pkg:/locale/images/channel-icon-hd-290x218.png"
  mm_icon_focus_sd: "pkg:/locale/images/channel-icon-sd-246x140.png"
  splash_screen_fhd: "pkg:/images/splash-fhd.webp"
  splash_screen_hd: "pkg:/images/splash-hd.webp"
  splash_screen_sd: "pkg:/images/splash-sd.webp"
  bs_libs_required: "roku_ads_lib"
  # We have a workaround for 9-patch handling when ui_resolutions is "fhd" and scaling down for non-4k devices.
  # If we ever add "sd" or "hd", the workaround will also need to be removed.
  ui_resolutions: "fhd"
  # Provides a flexible way to specify graphical image URIs that are automatically modified to replace a specified string with a string that gets a resolution-specific graphical image.
  # eg: "pkg:/images/selector-$$RES$$.9.png" will be chagned to "pkg:/images/selector-fhd.9.png" at runtime, if player supports full high-definition resolution.
  uri_resolution_autosub: "$$RES$$,sd,hd,fhd"
  requires_widevine_drm: 1
  requires_widevine_version: "1.0"
  supports_input_launch: 1
  supports_voice_roinput: 1
  supports_etc_seek: 1
  supports_etc_next: 1
  splash_min_time: 2000
  rsg_version: 1.2
  confirm_partner_button: 1
  sdk_instant_resume: 1
  run_as_process: 1
